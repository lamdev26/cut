<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghép Nhạc vào Ảnh + Sóng Nhạc & Hiệu Ứng CapCut</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 16px; background: #0f172a; color: #f1f5f9;
      display: flex; justify-content: center;
    }
    .container {
      width: 100%; max-width: 860px; background: #1e293b;
      padding: 20px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
    h1 { margin: 0 0 16px 0; font-size: 1.35rem; text-align: center; color: #38bdf8; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    @media (max-width: 680px) {
      .grid, .grid-3 { grid-template-columns: 1fr; }
    }
    .card {
      background: #0f172a; padding: 14px; border-radius: 10px;
      border: 1px solid #334155; margin-bottom: 14px;
    }
    .grid .card { margin-bottom: 0; }
    .section-title {
      font-size: 0.95rem; font-weight: 700; color: #38bdf8;
      margin: 0 0 12px 0; display: flex; align-items: center; gap: 6px;
    }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
    input[type="file"], select, input[type="number"] {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid #475569; background: #1e293b; color: #f8fafc; font-size: 0.9rem;
    }
    .color-row { display: flex; align-items: center; gap: 10px; }
    input[type="color"] {
      width: 44px; height: 36px; border: 1px solid #475569;
      border-radius: 6px; background: #1e293b; cursor: pointer; padding: 2px;
    }
    .checkbox-label {
      display: flex; align-items: center; gap: 6px; margin: 0;
      font-weight: 500; cursor: pointer; font-size: 0.85rem;
    }
    .preview-wrap {
      display: flex; justify-content: center; align-items: center;
      background: #020617; border-radius: 10px; padding: 10px; margin-bottom: 14px;
      min-height: 220px; border: 1px dashed #334155; position: relative;
    }
    #videoCanvas {
      max-width: 100%; max-height: 400px; border-radius: 6px; background: #000;
    }
    #waveformCanvas {
      width: 100%; height: 85px; background: #020617; border-radius: 8px;
      display: block; margin-bottom: 12px; border: 1px solid #334155;
    }
    .time-controls {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px;
    }
    .range-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .range-row span { min-width: 74px; font-size: 0.85rem; color: #94a3b8; }
    input[type="range"] { flex: 1; accent-color: #38bdf8; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    button, .download-btn {
      flex: 1; min-width: 125px; padding: 11px 14px; border: none; border-radius: 8px;
      font-weight: 600; font-size: 0.92rem; cursor: pointer; text-align: center;
      text-decoration: none; transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-full { background: #8b5cf6; color: #fff; }
    .btn-preview { background: #3b82f6; color: #fff; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-render { background: #10b981; color: #fff; flex-basis: 100%; }
    .download-btn { background: #f59e0b; color: #0f172a; display: block; width: 100%; }
    .progress-box { margin-top: 14px; display: none; }
    .progress-bar {
      width: 100%; height: 10px; background: #1e293b; border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%; background: #10b981; transition: width 0.1s linear;
    }
    .status { font-size: 0.85rem; color: #94a3b8; margin-top: 6px; text-align: center; }
    .result-box { display: none; }
    .result-box video { width: 100%; max-height: 380px; border-radius: 8px; background: #000; margin-bottom: 10px; }
    .hint { font-size: 0.8rem; color: #94a3b8; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ghép Nhạc vào Ảnh + Sóng Nhạc & Hiệu Ứng</h1>

    <!-- 1. CHỌN ẢNH & NHẠC -->
    <div class="grid">
      <div class="card">
        <div class="section-title">1. Ảnh nền & Khung hình</div>
        <label for="imageInput">Chọn ảnh (JPG, PNG, WebP)</label>
        <input type="file" id="imageInput" accept="image/*" />

        <div class="grid" style="margin-top: 10px; margin-bottom: 0; gap: 8px;">
          <div>
            <label for="aspectRatio">Tỷ lệ video</label>
            <select id="aspectRatio">
              <option value="9:16">9:16 (TikTok / Reels)</option>
              <option value="16:9">16:9 (YouTube)</option>
              <option value="1:1">1:1 (Vuông)</option>
              <option value="original">Theo ảnh gốc</option>
            </select>
          </div>
          <div>
            <label for="fitMode">Hiển thị ảnh</label>
            <select id="fitMode">
              <option value="cover">Lấp đầy khung (Đẹp nhất)</option>
              <option value="contain">Giữ nguyên ảnh (Viền đen)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">2. File âm thanh</div>
        <label for="audioInput">Chọn nhạc (MP3, WAV, M4A...)</label>
        <input type="file" id="audioInput" />
        <div id="audioInfo" class="hint" style="margin-top: 12px; word-break: break-word;">
          Chưa tải file âm thanh.
        </div>
      </div>
    </div>

    <!-- KHUNG XEM TRƯỚC TRỰC TIẾP -->
    <div class="preview-wrap">
      <canvas id="videoCanvas" width="720" height="1280"></canvas>
    </div>

    <!-- 3. TÙY CHỈNH HIỆU ỨNG -->
    <div class="card">
      <div class="section-title">3. Hiệu ứng ảnh nền, Sóng nhạc & Hạt rơi</div>
      <div class="grid-3">
        <div>
          <label for="bgEffect">Hiệu ứng ảnh nền (CapCut)</label>
          <select id="bgEffect">
            <option value="beat-zoom">Thu phóng giật theo nhạc (Beat Zoom)</option>
            <option value="beat-shake">Rung lắc + Giật mạnh (Remix)</option>
            <option value="beat-flash">Giật nhịp + Chớp sáng</option>
            <option value="beat-glitch">Giật nhịp + Bóng mờ Glitch</option>
            <option value="ken-burns">Zoom chậm điện ảnh</option>
            <option value="float">Trôi lơ lửng (Chill)</option>
            <option value="none">Ảnh tĩnh (Không hiệu ứng)</option>
          </select>
        </div>

        <div>
          <label for="visualizerType">Kiểu sóng nhạc</label>
          <select id="visualizerType">
            <option value="bars-bottom">Cột sóng đáy màn hình</option>
            <option value="bars-mirror">Cột sóng đối xứng giữa</option>
            <option value="circle">Vòng tròn sóng nhạc (EDM)</option>
            <option value="wave">Sóng lượn mềm mại</option>
            <option value="none">Tắt sóng nhạc</option>
          </select>
        </div>

        <div>
          <label for="particleType">Hiệu ứng rơi</label>
          <select id="particleType">
            <option value="snow">❄️ Tuyết rơi</option>
            <option value="stars">✨ Sao lấp lánh rơi</option>
            <option value="petals">🌸 Cánh hoa anh đào</option>
            <option value="bokeh">🫧 Đốm sáng bay (Bokeh)</option>
            <option value="rain">🌧️ Mưa rơi</option>
            <option value="hearts">❤️ Trái tim bay</option>
            <option value="none">Không có</option>
          </select>
        </div>
      </div>

      <div class="grid" style="margin-top: 12px; margin-bottom: 0; align-items: center;">
        <div>
          <div class="range-row" style="margin-bottom: 0;">
            <span>Độ giật:</span>
            <input type="range" id="effectIntensity" min="0.2" max="2.5" step="0.1" value="1.2" />
            <span id="intensityVal" style="min-width: 34px; text-align: right;">1.2x</span>
          </div>
        </div>
        <div class="color-row">
          <label style="margin: 0;">Màu sóng:</label>
          <input type="color" id="visualizerColor" value="#38bdf8" />
          <label class="checkbox-label">
            <input type="checkbox" id="rainbowMode" /> Cầu vồng RGB
          </label>
        </div>
      </div>
    </div>

    <!-- 4. CẮT ĐOẠN & NGHE THỬ -->
    <div class="card">
      <div class="section-title">4. Cắt đoạn & Xuất Video</div>
      <canvas id="waveformCanvas" width="760" height="85"></canvas>

      <div class="range-row">
        <span>Bắt đầu:</span>
        <input type="range" id="startSlider" min="0" max="0" step="0.1" value="0" disabled />
      </div>
      <div class="range-row">
        <span>Kết thúc:</span>
        <input type="range" id="endSlider" min="0" max="0" step="0.1" value="0" disabled />
      </div>

      <div class="time-controls">
        <div>
          <label for="startTime">Bắt đầu (s)</label>
          <input type="number" id="startTime" min="0" step="0.1" value="0" disabled />
        </div>
        <div>
          <label for="endTime">Kết thúc (s)</label>
          <input type="number" id="endTime" min="0" step="0.1" value="0" disabled />
        </div>
        <div>
          <label>Độ dài cắt</label>
          <input type="text" id="clipDuration" value="0.0s" readonly style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#38bdf8;font-weight:bold;" />
        </div>
      </div>

      <div class="actions">
        <button id="previewFullBtn" class="btn-full" disabled>▶ Nghe toàn bài</button>
        <button id="previewBtn" class="btn-preview" disabled>▶ Nghe đoạn cắt</button>
        <button id="stopBtn" class="btn-stop" disabled>■ Dừng</button>
        <button id="renderBtn" class="btn-render" disabled>🎬 Tạo Video</button>
      </div>

      <div class="progress-box" id="progressBox">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="status" id="statusText">Đang xử lý...</div>
      </div>
    </div>

    <!-- KẾT QUẢ -->
    <div class="result-box card" id="resultBox">
      <div class="section-title">Video đã hoàn thành</div>
      <video id="resultVideo" controls playsinline></video>
      <a id="downloadLink" class="download-btn" download="video.mp4">⬇ Tải Video về máy</a>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const audioInput = document.getElementById('audioInput');
    const aspectRatioSelect = document.getElementById('aspectRatio');
    const fitModeSelect = document.getElementById('fitMode');
    const bgEffectSelect = document.getElementById('bgEffect');
    const visualizerTypeSelect = document.getElementById('visualizerType');
    const particleTypeSelect = document.getElementById('particleType');
    const effectIntensityInput = document.getElementById('effectIntensity');
    const intensityVal = document.getElementById('intensityVal');
    const visualizerColorInput = document.getElementById('visualizerColor');
    const rainbowModeInput = document.getElementById('rainbowMode');

    const videoCanvas = document.getElementById('videoCanvas');
    const vCtx = videoCanvas.getContext('2d');
    const waveformCanvas = document.getElementById('waveformCanvas');
    const wCtx = waveformCanvas.getContext('2d');

    const startSlider = document.getElementById('startSlider');
    const endSlider = document.getElementById('endSlider');
    const startTimeInput = document.getElementById('startTime');
    const endTimeInput = document.getElementById('endTime');
    const clipDurationInput = document.getElementById('clipDuration');
    const audioInfo = document.getElementById('audioInfo');

    const previewFullBtn = document.getElementById('previewFullBtn');
    const previewBtn = document.getElementById('previewBtn');
    const stopBtn = document.getElementById('stopBtn');
    const renderBtn = document.getElementById('renderBtn');
    const progressBox = document.getElementById('progressBox');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const resultBox = document.getElementById('resultBox');
    const resultVideo = document.getElementById('resultVideo');
    const downloadLink = document.getElementById('downloadLink');

    let loadedImage = null;
    let audioCtx = null;
    let analyser = null;
    let freqData = null;
    let timeData = null;
    let audioBuffer = null;

    let previewSource = null;
    let previewStartCtxTime = 0;
    let previewOffsetSec = 0;
    let previewDurationSec = 0;
    let isPreviewing = false;
    let isRendering = false;

    // Biến phục vụ hiệu ứng chuyển động & nhịp beat
    let smoothBass = 0;
    let beatKick = 0;
    let animTime = 0;
    let lastFrameTs = performance.now();
    let particles = [];

    function initParticles() {
      particles = [];
      for (let i = 0; i < 65; i++) {
        particles.push({
          x: Math.random(),
          y: Math.random(),
          size: 0.4 + Math.random() * 0.9,
          speedY: 0.06 + Math.random() * 0.14,
          speedX: (Math.random() - 0.5) * 0.05,
          phase: Math.random() * Math.PI * 2,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 2.5,
          alpha: 0.4 + Math.random() * 0.6
        });
      }
    }
    initParticles();

    effectIntensityInput.addEventListener('input', () => {
      intensityVal.textContent = `${parseFloat(effectIntensityInput.value).toFixed(1)}x`;
    });

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.78;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        timeData = new Uint8Array(analyser.frequencyBinCount);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(1).padStart(4, '0');
      return `${m}:${s}`;
    }

    // 1. CẬP NHẬT KÍCH THƯỚC CANVAS & TẢI ẢNH
    function updateCanvasSize() {
      const mode = aspectRatioSelect.value;
      let targetW = 720, targetH = 1280;

      if (mode === 'original' && loadedImage) {
        const maxDim = 1280;
        const scale = Math.min(1, maxDim / Math.max(loadedImage.width, loadedImage.height));
        targetW = Math.floor((loadedImage.width * scale) / 2) * 2;
        targetH = Math.floor((loadedImage.height * scale) / 2) * 2;
      } else if (mode === '16:9') {
        targetW = 1280; targetH = 720;
      } else if (mode === '9:16') {
        targetW = 720; targetH = 1280;
      } else if (mode === '1:1') {
        targetW = 1080; targetH = 1080;
      }

      if (videoCanvas.width !== targetW || videoCanvas.height !== targetH) {
        videoCanvas.width = targetW;
        videoCanvas.height = targetH;
      }
    }

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        updateCanvasSize();
        checkReadyToRender();
      };
      img.src = URL.createObjectURL(file);
    });

    aspectRatioSelect.addEventListener('change', updateCanvasSize);

    // 2. XỬ LÝ ÂM THANH & WAVEFORM
    audioInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      stopPreview();
      audioInfo.textContent = 'Đang giải mã âm thanh...';

      try {
        const ctx = getAudioContext();
        const arrayBuffer = await file.arrayBuffer();
        audioBuffer = await ctx.decodeAudioData(arrayBuffer);

        const dur = Number(audioBuffer.duration.toFixed(1));
        audioInfo.textContent = `Đã tải: ${file.name} (${formatTime(dur)})`;

        [startSlider, endSlider, startTimeInput, endTimeInput].forEach(el => {
          el.disabled = false;
          el.max = dur;
        });

        startSlider.value = 0;
        startTimeInput.value = 0;
        endSlider.value = dur;
        endTimeInput.value = dur;

        updateClipDuration();
        drawWaveform();
        previewFullBtn.disabled = false;
        previewBtn.disabled = false;
        checkReadyToRender();
      } catch (err) {
        audioInfo.textContent = 'Lỗi: Không thể đọc file này. Hãy chọn file âm thanh hợp lệ.';
        console.error(err);
      }
    });

    function syncTimeInputs(source) {
      if (!audioBuffer) return;
      const maxDur = audioBuffer.duration;
      let start = parseFloat(source === 'slider' ? startSlider.value : startTimeInput.value) || 0;
      let end = parseFloat(source === 'slider' ? endSlider.value : endTimeInput.value) || maxDur;

      start = Math.max(0, Math.min(start, maxDur - 0.1));
      end = Math.max(start + 0.1, Math.min(end, maxDur));

      startSlider.value = start.toFixed(1);
      startTimeInput.value = start.toFixed(1);
      endSlider.value = end.toFixed(1);
      endTimeInput.value = end.toFixed(1);

      updateClipDuration();
      drawWaveform();
    }

    startSlider.addEventListener('input', () => syncTimeInputs('slider'));
    endSlider.addEventListener('input', () => syncTimeInputs('slider'));
    startTimeInput.addEventListener('change', () => syncTimeInputs('input'));
    endTimeInput.addEventListener('change', () => syncTimeInputs('input'));

    function updateClipDuration() {
      const start = parseFloat(startTimeInput.value) || 0;
      const end = parseFloat(endTimeInput.value) || 0;
      clipDurationInput.value = `${Math.max(0, end - start).toFixed(1)}s`;
    }

    function drawWaveform(playheadSec = null) {
      const width = waveformCanvas.width;
      const height = waveformCanvas.height;
      wCtx.clearRect(0, 0, width, height);
      wCtx.fillStyle = '#020617';
      wCtx.fillRect(0, 0, width, height);

      if (!audioBuffer) return;

      const data = audioBuffer.getChannelData(0);
      const step = Math.ceil(data.length / width);
      const amp = height / 2;

      const startSec = parseFloat(startTimeInput.value) || 0;
      const endSec = parseFloat(endTimeInput.value) || audioBuffer.duration;
      const startX = (startSec / audioBuffer.duration) * width;
      const endX = (endSec / audioBuffer.duration) * width;

      wCtx.fillStyle = 'rgba(56, 189, 248, 0.18)';
      wCtx.fillRect(startX, 0, endX - startX, height);

      for (let i = 0; i < width; i++) {
        let min = 1.0, max = -1.0;
        for (let j = 0; j < step; j++) {
          const datum = data[i * step + j];
          if (datum < min) min = datum;
          if (datum > max) max = datum;
        }
        wCtx.fillStyle = (i >= startX && i <= endX) ? '#38bdf8' : '#475569';
        wCtx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
      }

      wCtx.fillStyle = '#10b981';
      wCtx.fillRect(startX, 0, 2, height);
      wCtx.fillStyle = '#ef4444';
      wCtx.fillRect(endX - 2, 0, 2, height);

      if (playheadSec !== null) {
        const px = (playheadSec / audioBuffer.duration) * width;
        wCtx.fillStyle = '#facc15';
        wCtx.fillRect(px, 0, 2, height);
      }
    }

    // 3. PHÂN TÍCH NHỊP BASS & VẼ KHUNG HÌNH VIDEO
    function getAudioMetrics(isActiveAudio) {
      if (!isActiveAudio || !analyser || !freqData) {
        smoothBass *= 0.9;
        beatKick *= 0.85;
        return { bass: 0, kick: 0 };
      }
      analyser.getByteFrequencyData(freqData);
      analyser.getByteTimeDomainData(timeData);

      // Lấy dải tần trầm (Bass: bin 0 -> 8)
      let sum = 0;
      for (let i = 0; i < 9; i++) sum += freqData[i];
      const rawBass = (sum / (9 * 255));

      // Tạo cú giật sắc nét khi gặp tiếng trống Bass (kiểu CapCut)
      const diff = Math.max(0, rawBass - smoothBass);
      smoothBass = smoothBass * 0.75 + rawBass * 0.25;
      if (diff > 0.04 || rawBass > 0.72) {
        beatKick = Math.min(1, beatKick + diff * 3.2 + (rawBass > 0.72 ? 0.25 : 0));
      } else {
        beatKick *= 0.84;
      }
      return { bass: rawBass, kick: beatKick };
    }

    function drawBackgroundImage(W, H, metrics) {
      vCtx.fillStyle = '#000000';
      vCtx.fillRect(0, 0, W, H);

      if (!loadedImage) {
        vCtx.fillStyle = '#334155';
        vCtx.font = 'bold 28px system-ui';
        vCtx.textAlign = 'center';
        vCtx.fillText('Chọn ảnh nền để xem trước', W / 2, H / 2);
        return;
      }

      const effect = bgEffectSelect.value;
      const intensity = parseFloat(effectIntensityInput.value) || 1;
      const fitMode = fitModeSelect.value;

      const imgRatio = loadedImage.width / loadedImage.height;
      const canvasRatio = W / H;
      let baseW, baseH;

      if (fitMode === 'cover') {
        if (imgRatio > canvasRatio) {
          baseH = H;
          baseW = H * imgRatio;
        } else {
          baseW = W;
          baseH = W / imgRatio;
        }
      } else {
        if (imgRatio > canvasRatio) {
          baseW = W;
          baseH = W / imgRatio;
        } else {
          baseH = H;
          baseW = H * imgRatio;
        }
      }

      let scale = 1.0;
      let offsetX = 0;
      let offsetY = 0;
      let rotation = 0;
      let flashAlpha = 0;
      let glitchOffset = 0;

      const punch = metrics.kick * intensity;

      if (effect === 'beat-zoom') {
        scale = 1.04 + punch * 0.11;
      } else if (effect === 'beat-shake') {
        scale = 1.08 + punch * 0.13;
        offsetX = (Math.random() - 0.5) * 28 * punch;
        offsetY = (Math.random() - 0.5) * 28 * punch;
        rotation = (Math.random() - 0.5) * 0.045 * punch;
      } else if (effect === 'beat-flash') {
        scale = 1.04 + punch * 0.1;
        flashAlpha = Math.min(0.35, punch * 0.28);
      } else if (effect === 'beat-glitch') {
        scale = 1.05 + punch * 0.1;
        glitchOffset = punch * 18;
      } else if (effect === 'ken-burns') {
        scale = 1.02 + (Math.sin(animTime * 0.35) * 0.5 + 0.5) * 0.14 * intensity;
      } else if (effect === 'float') {
        scale = 1.08;
        offsetX = Math.sin(animTime * 0.9) * 16 * intensity;
        offsetY = Math.cos(animTime * 0.7) * 14 * intensity;
      }

      vCtx.save();
      vCtx.translate(W / 2 + offsetX, H / 2 + offsetY);
      vCtx.rotate(rotation);
      vCtx.scale(scale, scale);
      vCtx.drawImage(loadedImage, -baseW / 2, -baseH / 2, baseW, baseH);

      // Hiệu ứng bóng mờ Glitch khi đánh Bass
      if (effect === 'beat-glitch' && glitchOffset > 2) {
        vCtx.globalAlpha = 0.3;
        vCtx.globalCompositeOperation = 'screen';
        vCtx.drawImage(loadedImage, -baseW / 2 - glitchOffset, -baseH / 2, baseW, baseH);
        vCtx.drawImage(loadedImage, -baseW / 2 + glitchOffset, -baseH / 2, baseW, baseH);
      }
      vCtx.restore();

      // Hiệu ứng chớp sáng theo beat
      if (flashAlpha > 0.02) {
        vCtx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
        vCtx.fillRect(0, 0, W, H);
      }
    }

    function drawParticles(W, H, dt, metrics) {
      const type = particleTypeSelect.value;
      if (type === 'none') return;

      const speedBoost = 1 + metrics.kick * 1.4;

      for (const p of particles) {
        // Cập nhật vị trí
        if (type === 'bokeh' || type === 'hearts') {
          p.y -= p.speedY * dt * 0.65 * speedBoost;
          p.x += Math.sin(animTime * 1.5 + p.phase) * 0.04 * dt;
          if (p.y < -0.08) { p.y = 1.08; p.x = Math.random(); }
        } else if (type === 'rain') {
          p.y += p.speedY * dt * 4.5 * speedBoost;
          p.x -= 0.12 * dt;
          if (p.y > 1.08) { p.y = -0.05; p.x = Math.random() * 1.2; }
        } else {
          p.y += p.speedY * dt * speedBoost;
          p.x += (p.speedX + Math.sin(animTime * 1.8 + p.phase) * 0.03) * dt;
          p.rot += p.rotSpeed * dt;
          if (p.y > 1.08) { p.y = -0.06; p.x = Math.random(); }
          if (p.x > 1.08) p.x = -0.05;
          if (p.x < -0.08) p.x = 1.05;
        }

        const px = p.x * W;
        const py = p.y * H;
        const baseScale = Math.min(W, H) / 720;

        vCtx.save();
        if (type === 'snow') {
          const r = (3 + p.size * 5) * baseScale;
          vCtx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
          vCtx.beginPath();
          vCtx.arc(px, py, r, 0, Math.PI * 2);
          vCtx.fill();
        } else if (type === 'stars') {
          const twinkle = 0.4 + 0.6 * Math.abs(Math.sin(animTime * 3.5 + p.phase));
          const r = (4 + p.size * 7) * baseScale;
          vCtx.translate(px, py);
          vCtx.rotate(p.rot);
          vCtx.fillStyle = `rgba(254, 240, 138, ${p.alpha * twinkle})`;
          vCtx.beginPath();
          for (let i = 0; i < 4; i++) {
            const ang = (i * Math.PI) / 2;
            vCtx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
            vCtx.lineTo(Math.cos(ang + Math.PI / 4) * (r * 0.3), Math.sin(ang + Math.PI / 4) * (r * 0.3));
          }
          vCtx.closePath();
          vCtx.fill();
        } else if (type === 'petals') {
          const r = (6 + p.size * 7) * baseScale;
          vCtx.translate(px, py);
          vCtx.rotate(p.rot);
          vCtx.fillStyle = `rgba(251, 182, 206, ${p.alpha})`;
          vCtx.beginPath();
          vCtx.ellipse(0, 0, r, r * 0.52, 0, 0, Math.PI * 2);
          vCtx.fill();
        } else if (type === 'bokeh') {
          const r = (12 + p.size * 24) * baseScale;
          const grad = vCtx.createRadialGradient(px, py, 0, px, py, r);
          grad.addColorStop(0, `rgba(255, 255, 255, ${p.alpha * 0.45})`);
          grad.addColorStop(0.5, `rgba(56, 189, 248, ${p.alpha * 0.2})`);
          grad.addColorStop(1, 'rgba(56, 189, 248, 0)');
          vCtx.fillStyle = grad;
          vCtx.beginPath();
          vCtx.arc(px, py, r, 0, Math.PI * 2);
          vCtx.fill();
        } else if (type === 'rain') {
          vCtx.strokeStyle = `rgba(186, 230, 253, ${p.alpha * 0.65})`;
          vCtx.lineWidth = 1.8 * baseScale;
          vCtx.beginPath();
          vCtx.moveTo(px, py);
          vCtx.lineTo(px - 6 * baseScale, py + (22 + p.size * 18) * baseScale);
          vCtx.stroke();
        } else if (type === 'hearts') {
          const s = (6 + p.size * 7) * baseScale;
          vCtx.translate(px, py);
          vCtx.fillStyle = `rgba(244, 63, 94, ${p.alpha * 0.85})`;
          vCtx.beginPath();
          vCtx.moveTo(0, s * 0.35);
          vCtx.bezierCurveTo(-s, -s * 0.4, -s * 0.5, -s * 1.15, 0, -s * 0.45);
          vCtx.bezierCurveTo(s * 0.5, -s * 1.15, s, -s * 0.4, 0, s * 0.35);
          vCtx.fill();
        }
        vCtx.restore();
      }
    }

    function getVizColor(index, total) {
      if (rainbowModeInput.checked) {
        const hue = ((index / total) * 360 + animTime * 90) % 360;
        return `hsl(${hue}, 95%, 60%)`;
      }
      return visualizerColorInput.value;
    }

    function drawVisualizer(W, H, isActiveAudio) {
      const style = visualizerTypeSelect.value;
      if (style === 'none') return;

      const count = 48;
      const values = new Array(count).fill(0);

      for (let i = 0; i < count; i++) {
        if (isActiveAudio && freqData) {
          const bin = Math.floor((i / count) * (freqData.length * 0.72));
          values[i] = freqData[bin] / 255;
        } else {
          // Chuyển động nhẹ khi chưa bấm phát để dễ xem trước vị trí sóng
          values[i] = 0.08 + 0.06 * Math.abs(Math.sin(animTime * 2.5 + i * 0.3));
        }
      }

      vCtx.save();
      vCtx.shadowBlur = 12;

      if (style === 'bars-bottom') {
        const barW = (W * 0.88) / count;
        const startX = W * 0.06;
        const maxH = H * 0.24;
        const baseY = H - H * 0.04;

        for (let i = 0; i < count; i++) {
          const h = Math.max(4, values[i] * maxH);
          const color = getVizColor(i, count);
          vCtx.fillStyle = color;
          vCtx.shadowColor = color;
          vCtx.fillRect(startX + i * barW + 2, baseY - h, Math.max(2, barW - 4), h);
        }
      } else if (style === 'bars-mirror') {
        const barW = (W * 0.86) / count;
        const startX = W * 0.07;
        const maxH = H * 0.16;
        const centerY = H * 0.5;

        for (let i = 0; i < count; i++) {
          const h = Math.max(3, values[i] * maxH);
          const color = getVizColor(i, count);
          vCtx.fillStyle = color;
          vCtx.shadowColor = color;
          vCtx.fillRect(startX + i * barW + 2, centerY - h, Math.max(2, barW - 4), h * 2);
        }
      } else if (style === 'circle') {
        const cx = W / 2;
        const cy = H / 2;
        const radius = Math.min(W, H) * 0.22;
        const maxBar = Math.min(W, H) * 0.14;

        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
          const len = 6 + values[i] * maxBar;
          const x1 = cx + Math.cos(angle) * radius;
          const y1 = cy + Math.sin(angle) * radius;
          const x2 = cx + Math.cos(angle) * (radius + len);
          const y2 = cy + Math.sin(angle) * (radius + len);

          const color = getVizColor(i, count);
          vCtx.strokeStyle = color;
          vCtx.shadowColor = color;
          vCtx.lineWidth = Math.max(3, Math.min(W, H) * 0.008);
          vCtx.lineCap = 'round';
          vCtx.beginPath();
          vCtx.moveTo(x1, y1);
          vCtx.lineTo(x2, y2);
          vCtx.stroke();
        }
      } else if (style === 'wave') {
        const baseY = H * 0.82;
        const amp = H * 0.12;
        const color = getVizColor(0, 1);
        vCtx.strokeStyle = color;
        vCtx.shadowColor = color;
        vCtx.lineWidth = Math.max(3, W * 0.005);
        vCtx.beginPath();

        if (isActiveAudio && timeData) {
          const sliceW = W / timeData.length;
          for (let i = 0; i < timeData.length; i++) {
            const v = (timeData[i] - 128) / 128;
            const x = i * sliceW;
            const y = baseY + v * amp;
            if (i === 0) vCtx.moveTo(x, y);
            else vCtx.lineTo(x, y);
          }
        } else {
          for (let x = 0; x <= W; x += 12) {
            const y = baseY + Math.sin(x * 0.02 + animTime * 4) * 14;
            if (x === 0) vCtx.moveTo(x, y);
            else vCtx.lineTo(x, y);
          }
        }
        vCtx.stroke();
      }
      vCtx.restore();
    }

    function renderFrame(dt, isActiveAudio) {
      animTime += dt;
      const W = videoCanvas.width;
      const H = videoCanvas.height;
      const metrics = getAudioMetrics(isActiveAudio);

      drawBackgroundImage(W, H, metrics);
      drawParticles(W, H, dt, metrics);
      drawVisualizer(W, H, isActiveAudio);
    }

    // Vòng lặp xem trước liên tục trên trình duyệt
    function previewLoop(now) {
      const dt = Math.min(0.05, (now - lastFrameTs) / 1000);
      lastFrameTs = now;

      if (!isRendering) {
        renderFrame(dt, isPreviewing);

        if (isPreviewing && audioCtx) {
          const elapsed = audioCtx.currentTime - previewStartCtxTime;
          if (elapsed >= previewDurationSec) {
            stopPreview();
          } else {
            drawWaveform(previewOffsetSec + elapsed);
          }
        }
      }
      requestAnimationFrame(previewLoop);
    }
    requestAnimationFrame(previewLoop);

    // 4. NGHE THỬ TOÀN BÀI / ĐOẠN CẮT
    function playAudioSegment(startSec, durationSec) {
      if (!audioBuffer || durationSec <= 0) return;
      stopPreview();

      const ctx = getAudioContext();
      previewSource = ctx.createBufferSource();
      previewSource.buffer = audioBuffer;
      previewSource.connect(analyser);
      analyser.connect(ctx.destination);
      previewSource.start(0, startSec, durationSec);

      previewStartCtxTime = ctx.currentTime;
      previewOffsetSec = startSec;
      previewDurationSec = durationSec;
      isPreviewing = true;
      stopBtn.disabled = false;

      previewSource.onended = () => {
        if (isPreviewing) stopPreview();
      };
    }

    previewFullBtn.addEventListener('click', () => {
      if (audioBuffer) playAudioSegment(0, audioBuffer.duration);
    });

    previewBtn.addEventListener('click', () => {
      if (!audioBuffer) return;
      const start = parseFloat(startTimeInput.value);
      const end = parseFloat(endTimeInput.value);
      playAudioSegment(start, end - start);
    });

    stopBtn.addEventListener('click', stopPreview);

    function stopPreview() {
      isPreviewing = false;
      if (previewSource) {
        try { previewSource.stop(); } catch {}
        try { previewSource.disconnect(); } catch {}
        previewSource = null;
      }
      if (analyser) {
        try { analyser.disconnect(); } catch {}
      }
      stopBtn.disabled = true;
      drawWaveform();
    }

    function checkReadyToRender() {
      renderBtn.disabled = !(loadedImage && audioBuffer && !isRendering);
    }

    // 5. XUẤT VIDEO (30FPS + AUDIO + FULL HIỆU ỨNG)
    renderBtn.addEventListener('click', async () => {
      if (!loadedImage || !audioBuffer || isRendering) return;
      stopPreview();

      const start = parseFloat(startTimeInput.value);
      const end = parseFloat(endTimeInput.value);
      const duration = end - start;
      if (duration <= 0) return;

      isRendering = true;
      renderBtn.disabled = true;
      previewBtn.disabled = true;
      previewFullBtn.disabled = true;
      resultBox.style.display = 'none';
      progressBox.style.display = 'block';
      progressFill.style.width = '0%';
      statusText.textContent = `Đang tạo video (${duration.toFixed(1)} giây)... Vui lòng không khóa màn hình.`;

      const ctx = getAudioContext();
      const audioDest = ctx.createMediaStreamDestination();
      const source = ctx.createBufferSource();
      source.buffer = audioBuffer;

      // Kết nối qua analyser để hiệu ứng giật + sóng nhạc hoạt động lúc ghi hình
      source.connect(analyser);
      analyser.connect(audioDest);

      const canvasStream = videoCanvas.captureStream(30);
      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioDest.stream.getAudioTracks()
      ]);

      const mimeTypes = [
        'video/mp4;codecs=avc1,mp4a.40.2',
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];
      const selectedMime = mimeTypes.find(t => MediaRecorder.isTypeSupported(t)) || '';
      const isMp4 = selectedMime.includes('mp4');

      const recorder = new MediaRecorder(
        combinedStream,
        selectedMime ? { mimeType: selectedMime, videoBitsPerSecond: 4500000 } : {}
      );
      const chunks = [];

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      // Ghi hình ổn định 30fps
      const renderInterval = setInterval(() => {
        renderFrame(1 / 30, true);
      }, 1000 / 30);

      const renderStartTime = performance.now();
      const progressTimer = setInterval(() => {
        const elapsed = (performance.now() - renderStartTime) / 1000;
        const pct = Math.min(100, (elapsed / duration) * 100);
        progressFill.style.width = `${pct.toFixed(1)}%`;
        statusText.textContent = `Đang xuất video: ${Math.min(elapsed, duration).toFixed(1)}s / ${duration.toFixed(1)}s (${pct.toFixed(0)}%)`;
      }, 100);

      recorder.onstop = () => {
        clearInterval(renderInterval);
        clearInterval(progressTimer);
        try { analyser.disconnect(); } catch {}

        progressFill.style.width = '100%';
        statusText.textContent = 'Hoàn tất!';

        const blob = new Blob(chunks, { type: selectedMime || 'video/webm' });
        const url = URL.createObjectURL(blob);

        resultVideo.src = url;
        downloadLink.href = url;
        downloadLink.download = `video-hieu-ung.${isMp4 ? 'mp4' : 'webm'}`;
        resultBox.style.display = 'block';

        isRendering = false;
        previewBtn.disabled = false;
        previewFullBtn.disabled = false;
        checkReadyToRender();
      };

      recorder.start(100);
      source.start(0, start, duration);

      source.onended = () => {
        if (recorder.state !== 'inactive') recorder.stop();
      };
    });
  </script>
</body>
</html>
