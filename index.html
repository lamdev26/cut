<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghép MP3 vào Ảnh thành Video</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 24px; background: #0f172a; color: #f1f5f9;
      display: flex; justify-content: center;
    }
    .container {
      width: 100%; max-width: 820px; background: #1e293b;
      padding: 24px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h1 { margin-top: 0; font-size: 1.5rem; text-align: center; color: #38bdf8; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: #0f172a; padding: 14px; border-radius: 10px; border: 1px solid #334155;
    }
    label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: #cbd5e1; }
    input[type="file"], select, input[type="number"] {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid #475569; background: #1e293b; color: #f8fafc;
    }
    .preview-wrap {
      display: flex; justify-content: center; align-items: center;
      background: #020617; border-radius: 10px; padding: 12px; margin-bottom: 16px;
      min-height: 220px; border: 1px dashed #334155;
    }
    #videoCanvas {
      max-width: 100%; max-height: 360px; border-radius: 6px; background: #000;
    }
    #waveformCanvas {
      width: 100%; height: 90px; background: #020617; border-radius: 8px;
      display: block; margin-bottom: 12px; border: 1px solid #334155;
    }
    .time-controls {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;
    }
    .range-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .range-row span { min-width: 75px; font-size: 0.85rem; color: #94a3b8; }
    input[type="range"] { flex: 1; accent-color: #38bdf8; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    button, .download-btn {
      flex: 1; min-width: 140px; padding: 11px 16px; border: none; border-radius: 8px;
      font-weight: 600; font-size: 0.95rem; cursor: pointer; text-align: center;
      text-decoration: none; transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-preview { background: #3b82f6; color: #fff; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-render { background: #10b981; color: #fff; }
    .download-btn { background: #f59e0b; color: #0f172a; display: inline-block; }
    .progress-box { margin-top: 14px; display: none; }
    .progress-bar {
      width: 100%; height: 10px; background: #0f172a; border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%; background: #10b981; transition: width 0.1s linear;
    }
    .status { font-size: 0.85rem; color: #94a3b8; margin-top: 6px; text-align: center; }
    .result-box { margin-top: 18px; display: none; }
    .result-box video { width: 100%; max-height: 360px; border-radius: 8px; background: #000; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ghép MP3 vào Ảnh tạo Video</h1>

    <div class="grid">
      <div class="card">
        <label for="imageInput">1. Chọn ảnh nền (JPG, PNG, WebP)</label>
        <input type="file" id="imageInput" accept="image/*" />
        <label for="aspectRatio" style="margin-top: 10px;">Tỷ lệ khung hình</label>
        <select id="aspectRatio">
          <option value="original">Giữ nguyên tỷ lệ ảnh gốc</option>
          <option value="16:9">16:9 (Ngang - YouTube)</option>
          <option value="9:16">9:16 (Dọc - TikTok / Reels)</option>
          <option value="1:1">1:1 (Vuông)</option>
        </select>
      </div>

      <div class="card">
        <label for="audioInput">2. Chọn file âm thanh (MP3, WAV...)</label>
        <input type="file" id="audioInput" accept="audio/*" />
        <div id="audioInfo" style="margin-top: 12px; font-size: 0.85rem; color: #94a3b8;">
          Chưa tải file âm thanh.
        </div>
      </div>
    </div>

    <div class="preview-wrap">
      <canvas id="videoCanvas" width="640" height="360"></canvas>
    </div>

    <div class="card" id="trimSection">
      <label>3. Cắt đoạn âm thanh & Nghe thử</label>
      <canvas id="waveformCanvas" width="760" height="90"></canvas>

      <div class="range-row">
        <span>Bắt đầu:</span>
        <input type="range" id="startSlider" min="0" max="0" step="0.1" value="0" disabled />
      </div>
      <div class="range-row">
        <span>Kết thúc:</span>
        <input type="range" id="endSlider" min="0" max="0" step="0.1" value="0" disabled />
      </div>

      <div class="time-controls">
        <div>
          <label for="startTime">Bắt đầu (giây)</label>
          <input type="number" id="startTime" min="0" step="0.1" value="0" disabled />
        </div>
        <div>
          <label for="endTime">Kết thúc (giây)</label>
          <input type="number" id="endTime" min="0" step="0.1" value="0" disabled />
        </div>
        <div>
          <label>Thời lượng cắt</label>
          <input type="text" id="clipDuration" value="0.0s" readonly style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#38bdf8;font-weight:bold;" />
        </div>
      </div>

      <div class="actions">
        <button id="previewBtn" class="btn-preview" disabled>▶ Nghe thử đoạn chọn</button>
        <button id="stopBtn" class="btn-stop" disabled>■ Dừng nghe</button>
        <button id="renderBtn" class="btn-render" disabled>🎬 Tạo Video</button>
      </div>

      <div class="progress-box" id="progressBox">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="status" id="statusText">Đang xử lý...</div>
      </div>
    </div>

    <div class="result-box card" id="resultBox">
      <label>Video đã tạo xong:</label>
      <video id="resultVideo" controls></video>
      <a id="downloadLink" class="download-btn" download="video.mp4">⬇ Tải Video về máy</a>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const audioInput = document.getElementById('audioInput');
    const aspectRatioSelect = document.getElementById('aspectRatio');
    const videoCanvas = document.getElementById('videoCanvas');
    const vCtx = videoCanvas.getContext('2d');
    const waveformCanvas = document.getElementById('waveformCanvas');
    const wCtx = waveformCanvas.getContext('2d');

    const startSlider = document.getElementById('startSlider');
    const endSlider = document.getElementById('endSlider');
    const startTimeInput = document.getElementById('startTime');
    const endTimeInput = document.getElementById('endTime');
    const clipDurationInput = document.getElementById('clipDuration');
    const audioInfo = document.getElementById('audioInfo');

    const previewBtn = document.getElementById('previewBtn');
    const stopBtn = document.getElementById('stopBtn');
    const renderBtn = document.getElementById('renderBtn');
    const progressBox = document.getElementById('progressBox');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const resultBox = document.getElementById('resultBox');
    const resultVideo = document.getElementById('resultVideo');
    const downloadLink = document.getElementById('downloadLink');

    let loadedImage = null;
    let audioCtx = null;
    let audioBuffer = null;
    let previewSource = null;
    let previewRaf = null;
    let previewStartCtxTime = 0;
    let isRendering = false;

    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(1).padStart(4, '0');
      return `${m}:${s}`;
    }

    // 1. Xử lý ảnh và vẽ lên Canvas
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        drawVideoFrame();
        checkReadyToRender();
      };
      img.src = URL.createObjectURL(file);
    });

    aspectRatioSelect.addEventListener('change', () => {
      if (loadedImage) drawVideoFrame();
    });

    function drawVideoFrame() {
      if (!loadedImage) return;
      const mode = aspectRatioSelect.value;
      let targetW = 1280, targetH = 720;

      if (mode === 'original') {
        const maxDim = 1280;
        const scale = Math.min(1, maxDim / Math.max(loadedImage.width, loadedImage.height));
        targetW = Math.floor((loadedImage.width * scale) / 2) * 2;
        targetH = Math.floor((loadedImage.height * scale) / 2) * 2;
      } else if (mode === '16:9') {
        targetW = 1280; targetH = 720;
      } else if (mode === '9:16') {
        targetW = 720; targetH = 1280;
      } else if (mode === '1:1') {
        targetW = 1080; targetH = 1080;
      }

      if (videoCanvas.width !== targetW || videoCanvas.height !== targetH) {
        videoCanvas.width = targetW;
        videoCanvas.height = targetH;
      }

      // Nền đen
      vCtx.fillStyle = '#000000';
      vCtx.fillRect(0, 0, targetW, targetH);

      // Vẽ ảnh vừa khung (contain) không bị méo
      const imgRatio = loadedImage.width / loadedImage.height;
      const canvasRatio = targetW / targetH;
      let drawW, drawH, offsetX, offsetY;

      if (imgRatio > canvasRatio) {
        drawW = targetW;
        drawH = targetW / imgRatio;
        offsetX = 0;
        offsetY = (targetH - drawH) / 2;
      } else {
        drawH = targetH;
        drawW = targetH * imgRatio;
        offsetX = (targetW - drawW) / 2;
        offsetY = 0;
      }
      vCtx.drawImage(loadedImage, offsetX, offsetY, drawW, drawH);
    }

    // 2. Xử lý MP3 & vẽ Waveform
    audioInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      stopPreview();
      audioInfo.textContent = 'Đang giải mã âm thanh...';

      try {
        const ctx = getAudioContext();
        const arrayBuffer = await file.arrayBuffer();
        audioBuffer = await ctx.decodeAudioData(arrayBuffer);

        const dur = Number(audioBuffer.duration.toFixed(1));
        audioInfo.textContent = `Đã tải: ${file.name} (${formatTime(dur)})`;

        [startSlider, endSlider, startTimeInput, endTimeInput].forEach(el => {
          el.disabled = false;
          el.max = dur;
        });

        startSlider.value = 0;
        startTimeInput.value = 0;
        endSlider.value = dur;
        endTimeInput.value = dur;

        updateClipDuration();
        drawWaveform();
        previewBtn.disabled = false;
        checkReadyToRender();
      } catch (err) {
        audioInfo.textContent = 'Lỗi: Không thể đọc file âm thanh này.';
        console.error(err);
      }
    });

    function syncTimeInputs(source) {
      if (!audioBuffer) return;
      const maxDur = audioBuffer.duration;
      let start = parseFloat(source === 'slider' ? startSlider.value : startTimeInput.value) || 0;
      let end = parseFloat(source === 'slider' ? endSlider.value : endTimeInput.value) || maxDur;

      start = Math.max(0, Math.min(start, maxDur - 0.1));
      end = Math.max(start + 0.1, Math.min(end, maxDur));

      startSlider.value = start.toFixed(1);
      startTimeInput.value = start.toFixed(1);
      endSlider.value = end.toFixed(1);
      endTimeInput.value = end.toFixed(1);

      updateClipDuration();
      drawWaveform();
    }

    startSlider.addEventListener('input', () => syncTimeInputs('slider'));
    endSlider.addEventListener('input', () => syncTimeInputs('slider'));
    startTimeInput.addEventListener('change', () => syncTimeInputs('input'));
    endTimeInput.addEventListener('change', () => syncTimeInputs('input'));

    function updateClipDuration() {
      const start = parseFloat(startTimeInput.value) || 0;
      const end = parseFloat(endTimeInput.value) || 0;
      clipDurationInput.value = `${Math.max(0, end - start).toFixed(1)}s`;
    }

    function drawWaveform(playheadSec = null) {
      const width = waveformCanvas.width;
      const height = waveformCanvas.height;
      wCtx.clearRect(0, 0, width, height);
      wCtx.fillStyle = '#020617';
      wCtx.fillRect(0, 0, width, height);

      if (!audioBuffer) return;

      const data = audioBuffer.getChannelData(0);
      const step = Math.ceil(data.length / width);
      const amp = height / 2;

      const startSec = parseFloat(startTimeInput.value) || 0;
      const endSec = parseFloat(endTimeInput.value) || audioBuffer.duration;
      const startX = (startSec / audioBuffer.duration) * width;
      const endX = (endSec / audioBuffer.duration) * width;

      // Vùng được chọn
      wCtx.fillStyle = 'rgba(56, 189, 248, 0.18)';
      wCtx.fillRect(startX, 0, endX - startX, height);

      // Vẽ sóng âm
      for (let i = 0; i < width; i++) {
        let min = 1.0, max = -1.0;
        for (let j = 0; j < step; j++) {
          const datum = data[i * step + j];
          if (datum < min) min = datum;
          if (datum > max) max = datum;
        }
        const inSelection = i >= startX && i <= endX;
        wCtx.fillStyle = inSelection ? '#38bdf8' : '#475569';
        wCtx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
      }

      // Vạch bắt đầu & kết thúc
      wCtx.fillStyle = '#10b981';
      wCtx.fillRect(startX, 0, 2, height);
      wCtx.fillStyle = '#ef4444';
      wCtx.fillRect(endX - 2, 0, 2, height);

      // Vạch đang phát (playhead)
      if (playheadSec !== null) {
        const px = (playheadSec / audioBuffer.duration) * width;
        wCtx.fillStyle = '#facc15';
        wCtx.fillRect(px, 0, 2, height);
      }
    }

    // 3. Nghe thử đoạn cắt
    previewBtn.addEventListener('click', () => {
      if (!audioBuffer) return;
      stopPreview();

      const ctx = getAudioContext();
      const start = parseFloat(startTimeInput.value);
      const end = parseFloat(endTimeInput.value);
      const duration = end - start;
      if (duration <= 0) return;

      previewSource = ctx.createBufferSource();
      previewSource.buffer = audioBuffer;
      previewSource.connect(ctx.destination);
      previewSource.start(0, start, duration);

      previewStartCtxTime = ctx.currentTime;
      stopBtn.disabled = false;

      const updatePlayhead = () => {
        const elapsed = ctx.currentTime - previewStartCtxTime;
        if (elapsed >= duration) {
          stopPreview();
          return;
        }
        drawWaveform(start + elapsed);
        previewRaf = requestAnimationFrame(updatePlayhead);
      };
      previewRaf = requestAnimationFrame(updatePlayhead);

      previewSource.onended = () => stopPreview();
    });

    stopBtn.addEventListener('click', stopPreview);

    function stopPreview() {
      if (previewSource) {
        try { previewSource.stop(); } catch {}
        previewSource.disconnect();
        previewSource = null;
      }
      if (previewRaf) {
        cancelAnimationFrame(previewRaf);
        previewRaf = null;
      }
      stopBtn.disabled = true;
      drawWaveform();
    }

    function checkReadyToRender() {
      renderBtn.disabled = !(loadedImage && audioBuffer && !isRendering);
    }

    // 4. Xuất Video (Canvas + Web Audio -> MediaRecorder)
    renderBtn.addEventListener('click', async () => {
      if (!loadedImage || !audioBuffer || isRendering) return;
      stopPreview();

      const start = parseFloat(startTimeInput.value);
      const end = parseFloat(endTimeInput.value);
      const duration = end - start;
      if (duration <= 0) return;

      isRendering = true;
      renderBtn.disabled = true;
      previewBtn.disabled = true;
      resultBox.style.display = 'none';
      progressBox.style.display = 'block';
      progressFill.style.width = '0%';
      statusText.textContent = `Đang tạo video (${duration.toFixed(1)} giây)... Vui lòng không đóng tab.`;

      const ctx = getAudioContext();
      drawVideoFrame();

      // Luồng hình ảnh từ Canvas (30fps)
      const canvasStream = videoCanvas.captureStream(30);
      // Luồng âm thanh từ đoạn cắt
      const audioDest = ctx.createMediaStreamDestination();
      const source = ctx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioDest);

      // Gộp 2 luồng
      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioDest.stream.getAudioTracks()
      ]);

      // Chọn định dạng tốt nhất trình duyệt hỗ trợ
      const mimeTypes = [
        'video/mp4;codecs=avc1,mp4a.40.2',
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];
      const selectedMime = mimeTypes.find(t => MediaRecorder.isTypeSupported(t)) || '';
      const isMp4 = selectedMime.includes('mp4');

      const recorder = new MediaRecorder(combinedStream, selectedMime ? { mimeType: selectedMime } : {});
      const chunks = [];

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      // Giữ Canvas vẽ lại liên tục để trình duyệt ghi đều khung hình
      const drawInterval = setInterval(() => drawVideoFrame(), 1000 / 30);

      const renderStartTime = performance.now();
      const progressTimer = setInterval(() => {
        const elapsed = (performance.now() - renderStartTime) / 1000;
        const pct = Math.min(100, (elapsed / duration) * 100);
        progressFill.style.width = `${pct.toFixed(1)}%`;
        statusText.textContent = `Đang ghi video: ${Math.min(elapsed, duration).toFixed(1)}s / ${duration.toFixed(1)}s (${pct.toFixed(0)}%)`;
      }, 100);

      recorder.onstop = () => {
        clearInterval(drawInterval);
        clearInterval(progressTimer);
        progressFill.style.width = '100%';
        statusText.textContent = 'Hoàn tất!';

        const blob = new Blob(chunks, { type: selectedMime || 'video/webm' });
        const url = URL.createObjectURL(blob);

        resultVideo.src = url;
        downloadLink.href = url;
        downloadLink.download = `video-ghep.${isMp4 ? 'mp4' : 'webm'}`;
        resultBox.style.display = 'block';

        isRendering = false;
        previewBtn.disabled = false;
        checkReadyToRender();
      };

      recorder.start(100);
      source.start(0, start, duration);

      // Dừng ghi khi phát hết đoạn âm thanh cắt
      source.onended = () => {
        if (recorder.state !== 'inactive') recorder.stop();
      };
    });
  </script>
</body>
</html>
